<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Live</title>
<link rel="icon" href="/static/pulse-logo.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#100e17;color:#f7f3ff;font:16px/1.45 system-ui,sans-serif}header{border-bottom:1px solid #322744;padding:16px 5vw}header a{display:inline-flex;align-items:center;gap:10px;font-weight:750}header img{width:32px;height:32px}main{max-width:1100px;margin:auto;padding:30px 20px}h1,h2,p{margin:0 0 14px}h1{font-size:clamp(36px,6vw,58px);letter-spacing:-.055em}h2{font-size:20px}a{color:#d4b7ff;text-decoration:none}a:hover{text-decoration:underline}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:16px;align-items:start}.panel{background:#1c1627;border:1px solid #3a2e4e;border-radius:16px;padding:18px;margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{display:block;margin:12px 0 4px}button,input,select{font:inherit;color:inherit;border:1px solid #54416d;border-radius:8px;padding:8px 12px;background:#261d34}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}.primary{background:#c2a0ff;color:#1a1029;font-weight:700}input,select{width:100%}video{background:#09070d;width:100%;aspect-ratio:16/9;border-radius:10px;display:block;margin-bottom:12px}#status{color:#d0bce5;min-height:24px}#chat-log{height:260px;overflow:auto;overflow-wrap:anywhere}.message{border-bottom:1px solid #392e48;padding:8px 0}.message button{font-size:12px;padding:3px 6px;margin:4px 4px 0 0}#chat-form{display:flex;gap:6px;margin-top:10px}#chat-form input{min-width:0}li{margin-bottom:8px}#badge{color:#ff9cb3;font-weight:750}meter{width:100%;margin:0 0 10px}[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
<script src="/static/live.js" defer></script>
</head>
<body>
<header><a href="/"><img src="/static/pulse-logo.png" alt=""> Back to Pulse</a></header>
<main>
<h1>Pulse Live</h1>
<p id="status" role="status"></p>
<div id="layout" class="layout" hidden>
<div>
<section class="panel" id="studio">
<h2 id="studio-title">Broadcast studio</h2>
<video id="video" playsinline autoplay hidden></video>
<div id="preview-tools" hidden>
<label for="level">Microphone level</label><meter id="level" min="0" max="1" value="0"></meter>
<div class="row"><button id="camera">Turn camera off</button><button id="mic">Mute mic</button><button id="cancel">Stop preview</button></div>
</div>
<form id="broadcast">
<label for="title">Stream title</label><input id="title" maxlength="100" required>
<label for="audience">Audience</label><select id="audience"><option value="public">Public to Pulse members</option><option value="followers">Followers only</option></select>
<div class="row" style="margin-top:12px"><button type="button" id="preview">Preview camera and mic</button><button class="primary" id="start" type="submit">Go Live</button></div>
</form>
<div class="row" id="session" hidden><span id="badge">● LIVE</span><button id="share">Copy stream link</button><button id="leave"></button></div>
</section>
<section class="panel" id="discovery"><h2>Live now</h2><ul id="streams"></ul></section>
</div>
<section class="panel" id="chat" hidden>
<h2>Live chat</h2><div id="chat-log" role="log" aria-label="Chat messages"></div>
<form id="chat-form"><input id="message" aria-label="Chat message" placeholder="Say something" maxlength="280" required><button id="send">Send</button></form>
</section>
</div>
</main>
</body>
</html>
