<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Your world, in motion</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color-scheme:dark;--bg:#090912;--panel:#151524;--line:#303047;--muted:#a3a1b8;--accent:#a879ff;--text:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:1320px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:20px;padding:22px}.sidebar,.right{position:sticky;top:20px;align-self:start}.brand{font-size:32px;font-weight:900;letter-spacing:-2px;margin:0 0 28px 12px}.brand span{color:var(--accent)}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);font-weight:700;font-size:16px;border-radius:13px;padding:15px;margin-bottom:4px}.nav button:hover,.nav button.active{background:#28223e;color:#c9a9ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;margin-bottom:15px;overflow:hidden}.pad{padding:20px}.head{padding:19px 21px;border-bottom:1px solid var(--line);font-size:22px;font-weight:800}.muted{color:var(--muted)}.small{font-size:13px}.btn{background:#8350e5;color:white;border:0;border-radius:999px;padding:10px 17px;font-weight:700}.btn.alt{background:#2d2940}.btn.danger{background:#94304b}.input{width:100%;background:#202034;border:1px solid #3b3951;border-radius:12px;color:var(--text);padding:12px;outline:none;margin:5px 0 12px}.input:focus{border-color:var(--accent)}textarea.input{resize:vertical;min-height:100px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#bb74ff,#4b35b3);font-weight:900}.post{padding:20px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0}.post img,.post video{max-width:100%;width:100%;max-height:500px;object-fit:contain;border-radius:13px;background:#07070d}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{border:0;background:#25233a;color:#d1cde0;border-radius:10px;padding:8px 12px}.actions button.on{color:#ff81b0}.person{padding:14px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.tabs{display:flex;gap:8px;padding:13px}.tabs button{flex:1}.empty{text-align:center;padding:40px;color:var(--muted)}.bubble{padding:12px;border-radius:15px;background:#28243e;margin:10px 0;max-width:85%;width:fit-content}.bubble.mine{margin-left:auto;background:#6241aa}.badge{font-size:11px;color:#c9adff;background:#2e2347;padding:5px 8px;border-radius:20px}.hidden{display:none!important}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#7045c4;border-radius:12px;z-index:10}.right .card{padding:18px}a{color:#caaaff}#mobile{display:none}@media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:700px){.app{display:block;padding:0 0 72px}.sidebar{display:none}.card{border-radius:0;margin-bottom:9px}#mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#181626;border-top:1px solid var(--line);justify-content:space-around;z-index:5}#mobile button{background:none;border:0;color:white;font-size:22px;padding:12px}}
.card{box-shadow:0 8px 36px #0002}.nav button{transition:background .2s,transform .2s}.nav button:hover{transform:translateX(3px)}.btn{transition:filter .2s,transform .2s}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.post{transition:background .2s}.post:hover{background:#ffffff05}::selection{background:#8350e5;color:white}@media(max-width:700px){.head{font-size:19px}.post{padding:15px}.tabs{overflow:auto}} </style></head><body><div id="auth" class="card pad" style="max-width:430px;margin:9vh auto"><h1 class="brand">pulse<span>.</span></h1><p class="muted">Your world, in motion. Real accounts, real people.</p><div class="tabs"><button class="btn" onclick="authMode='login';drawAuth()">Log in</button><button class="btn alt" onclick="authMode='register';drawAuth()">Sign up</button></div><div id="authForm"></div></div><div id="app" class="app hidden"><aside class="sidebar"><div class="brand">pulse<span>.</span> <span class="badge">v0.4</span></div><nav id="nav" class="nav"></nav><div class="card pad" id="mini"></div></aside><main id="main"></main><aside class="right"><div class="card"><h3>🌎 Connected Pulse</h3><p class="muted small">Your posts and messages are stored on the server and shared with other signed-in users.</p></div><div class="card"><h3>✨ Discover people</h3><div id="suggest"></div></div><div class="card muted small">Pulse v0.4 • Community beta</div></aside></div><nav id="mobile"></nav><div id="toast" class="hidden"></div><script>
let storyMedia='',me=null,page='home',mode='all',authMode='login',chatUser=null,upload=null,search='',users=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const avatar=u=>`<span class="avatar">${esc((u.name||'?').slice(0,1).toUpperCase())}</span>`;const date=t=>new Date(t*1000).toLocaleString();function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2700)}async function api(path,data,method='POST'){let opts={method,credentials:'same-origin'};if(data!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(data)}let r=await fetch('/api/'+path,opts);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function action(path,data,after){try{await api(path,data);if(after)await after();else await render()}catch(e){toast(e.message)}}function drawAuth(){$('#authForm').innerHTML=`${authMode==='register'?'<input id="name" class="input" placeholder="Display name" maxlength="40">':''}<input id="username" class="input" placeholder="Username" maxlength="20" autocomplete="username"><input id="password" class="input" placeholder="Password (8+ characters to sign up)" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}"><button class="btn" style="width:100%" onclick="submitAuth()">${authMode==='login'?'Log in':'Create account'}</button>`}async function submitAuth(){try{let d={username:$('#username').value,password:$('#password').value};if(authMode==='register')d.name=$('#name').value;me=(await api(authMode,d)).user;start()}catch(e){toast(e.message)}}function start(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}async function logout(){await api('logout',{});me=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');drawAuth()}
const navs=[['home','⌂ Home'],['explore','⌕ Explore'],['clips','▶ Clips'],['messages','✉ Messages'],['stories','◷ Stories'],['communities','♧ Communities'],['notifications','♢ Alerts'],['bookmarks','▣ Saved'],['profile','◉ Profile'],['settings','⚙ Settings']];function go(p){page=p;render()}function shell(){let html=navs.map(([p,t])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${t}</button>`).join('');$('#nav').innerHTML=html;$('#mobile').innerHTML=navs.slice(0,5).map(([p,t])=>`<button onclick="go('${p}')" title="${p}">${t.split(' ')[0]}</button>`).join('');$('#mini').innerHTML=`<div class="row">${avatar(me)}<div><b>${esc(me.name)}</b><div class="muted small">@${esc(me.username)}</div></div></div><button class="btn alt" style="margin-top:12px" onclick="logout()">Log out</button>`}
function composer(){return `<section class="card pad"><div class="row">${avatar(me)}<b>Share something</b></div><textarea class="input" id="postText" maxlength="1000" placeholder="What's happening?"></textarea><div id="uploadStatus" class="muted small">Images: PNG/JPG/GIF/WebP · Videos: MP4/WebM · Max 12 MB</div><input type="file" class="input" id="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm" onchange="uploadFile(this)"><div class="row between"><span class="muted small">Public post</span><button class="btn" onclick="post()">Publish ↗</button></div></section>`}async function uploadFile(input){let file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024)return toast('Maximum file size is 12 MB');$('#uploadStatus').textContent='Uploading...';try{let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':file.type},body:file});let j=await r.json();if(!r.ok)throw Error(j.error);upload=j.url;$('#uploadStatus').textContent='✓ '+file.name+' uploaded'}catch(e){upload=null;$('#uploadStatus').textContent='Upload failed';toast(e.message)}}async function post(){let body=$('#postText').value.trim();await action('posts',{body,media:upload||''},()=>{upload=null;return render()})}
function postHTML(p){let u={name:p.name,username:p.username};return `<article class="post"><div class="row">${avatar(u)}<div><b>${esc(p.name)}</b> <span class="muted small">@${esc(p.username)} · ${date(p.created)}</span></div></div><div class="body">${esc(p.body)}</div>${p.media?(p.kind==='clip'?`<video controls preload="metadata" src="${esc(p.media)}"></video>`:`<img loading="lazy" alt="Post media" src="${esc(p.media)}">`):''}<div class="actions"><button class="${p.liked?'on':''}" onclick="action('like',{post:${p.id}})">♥ ${p.likes}</button><button onclick="comments(${p.id})">💬 ${p.comments}</button><button class="${p.bookmarked?'on':''}" onclick="action('bookmark',{post:${p.id}})">🔖 ${p.bookmarked?'Saved':'Save'}</button>${p.user_id===me.id?`<button onclick="if(confirm('Delete post?'))action('delete',{post:${p.id}})">🗑 Delete</button>`:`<button onclick="action('follow',{user:${p.user_id}})">${p.following?'✓ Following':'+ Follow'}</button>`}</div><div id="comments${p.id}" class="hidden"></div></article>`}async function comments(id){let el=$('#comments'+id);if(!el.classList.contains('hidden'))return el.classList.add('hidden');try{let j=await api('comments?post='+id,undefined,'GET');el.innerHTML=j.comments.map(c=>`<p class="small"><b>@${esc(c.username)}</b> ${esc(c.body)}</p>`).join('')+`<div class="row"><input id="comment${id}" class="input" maxlength="500" placeholder="Reply..."><button class="btn" onclick="action('comment',{post:${id},body:$('#comment${id}').value},()=>commentsRefresh(${id}))">Send</button></div>`;el.classList.remove('hidden')}catch(e){toast(e.message)}}async function commentsRefresh(id){await render();await comments(id)}async function feed(){let q='posts?mode='+mode+'&q='+encodeURIComponent(search);let j=await api(q,undefined,'GET');return j.posts.length?j.posts.map(postHTML).join(''):'<div class="empty">Nothing here yet. Make the first post!</div>'}
function peopleHTML(list){return list.map(u=>`<div class="row between person"><div class="row">${avatar(u)}<div><b>${esc(u.name)}</b><div class="muted small">@${esc(u.username)}</div><div class="small">${esc(u.bio)}</div></div></div>${u.id===me.id?'':`<button class="btn alt" onclick="chatUser=${u.id};go('messages')">Message</button>`}</div>`).join('')||'<div class="empty">No users found</div>'}
async function render(){if(!me)return;shell();let main=$('#main');main.innerHTML='<section class="card pad muted">Loading...</section>';try{if(page==='home'||page==='clips'){mode=page==='clips'?'clips':mode==='clips'?'all':mode;main.innerHTML=`<section class="card"><div class="head">${page==='clips'?'▶ Pulse Clips':'Home feed'}</div>${page==='home'?`<div class="tabs"><button class="btn ${mode==='all'?'':'alt'}" onclick="mode='all';render()">For you</button><button class="btn ${mode==='following'?'':'alt'}" onclick="mode='following';render()">Following</button></div>`:''}</section>${composer()}<section class="card">${await feed()}</section>`}else if(page==='bookmarks'){let j=await api('bookmarks',undefined,'GET');main.innerHTML=`<section class="card"><div class="head">🔖 Saved posts</div>${j.posts.map(postHTML).join('')||'<div class="empty">Nothing saved yet</div>'}</section>`}else if(page==='stories'){let j=await api('stories',undefined,'GET');main.innerHTML=`<section class="card pad"><h2>◷ Stories</h2><p class="muted">Stories disappear from the feed after 24 hours.</p><textarea id="storyText" class="input" maxlength="250" placeholder="Share a moment..."></textarea><input id="storyFile" class="input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm" onchange="uploadFileStory(this)"><p id="storyUpload" class="small muted"></p><button class="btn" onclick="action('story',{body:$('#storyText').value,media:storyMedia},()=>{storyMedia='';render()})">Share story</button></section><section class="card">${j.stories.map(x=>`<div class="post"><div class="row">${avatar(x)}<b>@${esc(x.username)}</b><span class="small muted">${date(x.created)}</span></div><p class="body">${esc(x.body)}</p>${x.media?(x.media.endsWith('.mp4')||x.media.endsWith('.webm')?`<video controls src="${esc(x.media)}"></video>`:`<img src="${esc(x.media)}" alt="Story">`):''}</div>`).join('')||'<div class="empty">No stories yet</div>'}</section>`}else if(page==='notifications'){let j=await api('notifications',undefined,'GET');main.innerHTML=`<section class="card pad"><div class="row between"><h2>♢ Notifications</h2><button class="btn alt" onclick="action('notifications-read',{})">Mark all read</button></div>${j.notifications.map(n=>`<div class="person ${n.seen?'muted':''}"><b>@${esc(n.username)}</b> ${esc(({like:'liked your',comment:'commented on your',follow:'followed you',message:'sent you a message'})[n.kind]||n.kind)} ${esc(n.detail)} <span class="small muted">· ${date(n.created)}</span></div>`).join('')||'<div class="empty">No notifications yet</div>'}</section>`}else if(page==='communities'){let j=await api('communities',undefined,'GET');main.innerHTML=`<section class="card pad"><h2>♧ Communities</h2><p class="muted">Find your people, start a community, and share discussions.</p><input id="communityName" class="input" maxlength="45" placeholder="New community name"><input id="communityDesc" class="input" maxlength="250" placeholder="Description"><button class="btn" onclick="action('community-create',{name:$('#communityName').value,description:$('#communityDesc').value})">Create community</button></section>${j.communities.map(c=>`<section class="card pad"><div class="row between"><div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.description)}</p><span class="small muted">${c.members} members · by @${esc(c.username)}</span></div><button class="btn alt" onclick="action('community-join',{id:${c.id}})">${c.joined?'Leave':'Join'}</button></div><button class="btn alt" style="margin-top:12px" onclick="openCommunity(${c.id},'${encodeURIComponent(c.name)}')">View discussions →</button></section>`).join('')||'<section class="card empty">No communities yet. Create the first one!</section>'}` }else if(page==='explore'){let j=await api('users?q='+encodeURIComponent(search),undefined,'GET');main.innerHTML=`<section class="card pad"><h2>Explore</h2><input id="search" class="input" placeholder="Search people and posts" value="${esc(search)}"><button class="btn" onclick="search=$('#search').value;render()">Search</button><h3>People</h3>${peopleHTML(j.users)}</section><section class="card"><div class="head">Posts</div>${await feed()}</section>`}else if(page==='messages'){let j=await api('users',undefined,'GET');users=j.users.filter(u=>u.id!==me.id);if(!chatUser&&users.length)chatUser=users[0].id;let m=chatUser?await api('messages?user='+chatUser,undefined,'GET'):{messages:[]};main.innerHTML=`<section class="card pad"><h2>Direct messages</h2><p class="muted small">Messages update automatically while this page is open.</p><select class="input" onchange="chatUser=Number(this.value);render()">${users.map(u=>`<option value="${u.id}" ${u.id===chatUser?'selected':''}>@${esc(u.username)}</option>`).join('')}</select><div style="min-height:200px">${m.messages.map(x=>`<div class="bubble ${x.sender===me.id?'mine':''}">${esc(x.body)}<div class="small muted">${date(x.created)}</div></div>`).join('')||'<div class="empty">Start a conversation!</div>'}</div><div class="row"><input class="input" id="message" maxlength="1000" placeholder="Write a message"><button class="btn" onclick="sendMessage()">Send</button></div></section>`}else if(page==='profile'){mode='all';let j=await api('posts',undefined,'GET');main.innerHTML=`<section class="card pad"><div class="row">${avatar(me)}<div><h2>${esc(me.name)}</h2><div class="muted">@${esc(me.username)}</div></div></div><p>${esc(me.bio)}</p><button class="btn alt" onclick="go('settings')">Edit profile</button></section><section class="card"><div class="head">Your posts</div>${j.posts.filter(p=>p.user_id===me.id).map(postHTML).join('')||'<div class="empty">No posts yet</div>'}</section>`}else if(page==='settings'){main.innerHTML=`<section class="card pad"><h2>Edit profile</h2><label>Name<input id="setName" class="input" maxlength="40" value="${esc(me.name)}"></label><label>Bio<textarea id="setBio" class="input" maxlength="200">${esc(me.bio)}</textarea></label><button class="btn" onclick="saveProfile()">Save changes</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><button class="btn danger" onclick="logout()">Log out</button></section>`}let people=await api('users',undefined,'GET');$('#suggest').innerHTML=peopleHTML(people.users.filter(u=>u.id!==me.id).slice(0,4))}catch(e){main.innerHTML=`<section class="card pad">${esc(e.message)}</section>`}}
async function uploadFileStory(input){let f=input.files?.[0];if(!f)return;try{let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);storyMedia=j.url;$('#storyUpload').textContent='✓ '+f.name}catch(e){toast(e.message)}}async function openCommunity(id,name){name=decodeURIComponent(name);try{let j=await api('community-posts?id='+id,undefined,'GET');$('#main').innerHTML=`<section class="card pad"><button class="btn alt" onclick="go('communities')">← Back</button><h2>${esc(name)}</h2><textarea id="communityText" class="input" maxlength="1000" placeholder="Start a discussion..."></textarea><button class="btn" onclick="action('community-post',{id:${id},body:$('#communityText').value},()=>openCommunity(${id},'${encodeURIComponent(name)}'))">Post discussion</button></section><section class="card">${j.posts.map(x=>`<div class="post"><b>${esc(x.name)}</b> <span class="muted small">@${esc(x.username)} · ${date(x.created)}</span><p class="body">${esc(x.body)}</p></div>`).join('')||'<div class="empty">No discussions yet</div>'}</section>`}catch(e){toast(e.message)}}async function sendMessage(){if(!chatUser)return toast('No recipient selected');await action('message',{user:chatUser,body:$('#message').value})}async function saveProfile(){await action('profile',{name:$('#setName').value,bio:$('#setBio').value},async()=>{me=(await api('me',undefined,'GET')).user;await render();toast('Saved!')})}async function init(){drawAuth();try{me=(await api('me',undefined,'GET')).user;if(me)start()}catch(e){toast('Could not connect to the Pulse server')}}init();setInterval(async()=>{if(me&&page==='messages'&&!document.activeElement?.matches('input,textarea'))await render()},5000);
</script></body></html>
